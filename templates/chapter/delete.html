{% extends 'layout.html' %}

{% block title %}Delete Chapters{% endblock %}

{% block styles %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


{% endblock %}

{% block content %}



    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box">
            <h2 class="text-center">Delete chapter</h2>
            <h3 class="text-center">Are you sure you want to delete {{chapter.name}}?</h3>
            <br>
            <form action="{{ url_for('delete_chapter_post', chapter_id=chapter.id) }}" method="POST"  class="d-flex justify-content-center gap-3">
                <a href="{{url_for('show_subject', id=chapter.sub_id)}}" class="btn btn-primary">
                    Cancel
                </a>
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Delete
                </button>



            </form>
        </div>
    </div>

{% endblock %}
