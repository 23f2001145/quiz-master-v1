{% extends 'layout.html' %}

{% block title %}Add Chapter{% endblock %}

{% block styles %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


{% endblock %}

{% block content %}





    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box">
            <h2 class="text-center">Add chapter</h2>
            <form action="{{ url_for('add_chapter_post', subject_id = subject.id)}}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Chapter Name</label>
                    <input type="text" class="form-control" name="chap_name" placeholder="Enter chapter name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Chapter Description</label>
                    <input type="text" class="form-control" name="chap_desc" placeholder="Enter chapter description">
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject</label><br>
<!--                    <select name="subject_id" id="subject_id" class="form-control" required>-->
<!--                        {% for sub in subjects %}-->
<!--                        {% if sub.id == subject.id %}-->
<!--                            <option selected value="{{sub.id}}">{{sub.name}}</option>-->
<!--                        {% else %}-->
<!--                            <option value="{{sub.id}}">{{sub.name}}</option>-->
<!--                        {% endif %}-->
<!--                        {% endfor %}-->
<!--                    </select>-->
                    <input type="text" class="form-control" value="{{ subject.name }}" readonly>
                </div>
                <input type="hidden" name="subject_id" value="{{ subject.id }}">
                <button type="submit" class="btn btn-success w-100 login-btn">Create chapter</button>
            </form>
        </div>
    </div>

{% endblock %}
