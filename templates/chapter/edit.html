{% extends 'layout.html' %}

{% block title %}Add Chapters{% endblock %}

{% block styles %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


{% endblock %}

{% block content %}





    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box">
            <h2 class="text-center">Edit chapter</h2>
            <form action="{{ url_for('edit_chapter_post', chapter_id=chapter.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Chapter Name</label>
                    <input type="text" class="form-control" name="chap_name" value="{{chapter.name}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Chapter Description</label>
                    <input type="text" class="form-control" name="chap_desc" value="{{chapter.desc}}">
                </div>
                <div class="mb-3">
                    <label for="subject_id" class="form-label">Subject:</label>
                    <select name="subject_id" id="subject_id" class="form-control" required>
                        {% for sub in subjects %}
                        {% if sub.id == chapter.sub_id %}
                            <option selected value="{{sub.id}}">{{sub.name}}</option>
                        {% else %}
                            <option value="{{sub.id}}">{{sub.name}}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 login-btn">Update chapter</button>
            </form>
        </div>
    </div>

{% endblock %}
