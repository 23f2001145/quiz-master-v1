{% extends 'layout.html' %}

{% block title %}Add Subjects{% endblock %}

{% block styles %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


{% endblock %}

{% block content %}





    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box">
            <h2 class="text-center">Add subject</h2>
            <form action="{{ url_for('add_subject') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Subject Name</label>
                    <input type="text" class="form-control" name="sub_name" placeholder="Enter subject name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject Description</label>
                    <input type="text" class="form-control" name="sub_desc" placeholder="Enter subject description">
                </div>
                <button type="submit" class="btn btn-success w-100 login-btn">Create subject</button>
            </form>
        </div>
    </div>

{% endblock %}
