{% extends 'layout.html' %}

{% block title %}Question - {{question.name}}{% endblock %}

{% block styles %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


{% endblock %}

{% block content %}





   <div class="container d-flex justify-content-center align-items-center min-vh-100" style="margin-top: 100px;">
    <div class="login-box">
        <h2 class="text-center">{{ question.name }}</h2>
        <div class="mb-3">
            <label class="form-label">Question Name</label>
            <input type="text" class="form-control" name="que_name" value="{{ question.name }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Question Statement</label>
            <input type="text" class="form-control" name="que" value="{{ question.q_statement }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Option 1</label>
            <input type="text" class="form-control" name="op1" value="{{ question.opt1 }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Option 2</label>
            <input type="text" class="form-control" name="op2" value="{{ question.opt2 }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Option 3</label>
            <input type="text" class="form-control" name="op3" value="{{ question.opt3 }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Option 4</label>
            <input type="text" class="form-control" name="op4" value="{{ question.opt4 }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Answer</label>
            <input type="text" class="form-control" name="ans" value="{{ question.ans }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Quiz</label>
            <input type="text" class="form-control" name="quiz" value="{{ quiz.name }}" readonly>
        </div>
    </div>
</div>


{% endblock %}
