{% extends 'layout.html' %}

{% block title %}Edit Quiz{% endblock %}

{% block styles %}

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


{% endblock %}

{% block content %}





    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box">
            <h2 class="text-center">Edit quiz</h2>
            <form action="{{ url_for('edit_quiz_post', quiz_id = quiz.id)}}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Quiz Name</label>
                    <input type="text" class="form-control" name="quiz_name" placeholder="Enter quiz name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Quiz Duration</label>
                    <input type="text" class="form-control" name="quiz_dur" placeholder="Enter quiz duration (in minutes)">
                </div>
                <div class="mb-3">
                    <label for="chapter_id" class="form-label">Chapter:</label>
                    <select name="chapter_id" id="chapter_id" class="form-control" required>
                        {% for chap in chapters %}
                        {% if chap.id == quiz.chap_id %}
                            <option selected value="{{chap.id}}">{{chap.name}}</option>
                        {% else %}
                            <option value="{{chap.id}}">{{chap.name}}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 login-btn">Update quiz</button>
            </form>
        </div>
    </div>

{% endblock %}
