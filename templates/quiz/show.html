{% extends 'layout.html' %}

{% block title %}{{quiz.name}}{% endblock %}

{% block styles %}
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    .table-container {
        display: flex;
        justify-content: center;
    }


    .table {
        width: 90%; /* Adjust as needed */
    }

    .heading {
        text-align: center;
    }

</style>
{% endblock %}

{% block content %}

    <h3 class="display-1 text-center">{{quiz.name}}</h3>
<!--    <h2 class="display-4 heading">Subjects</h2>-->
    <br>

    <div class="table-container">
        <table class="table text-center">
            <thead>
                <tr>
                    <th>Question ID</th>
                    <th>Question Name</th>
<!--                <th>No. of Questions</th>-->
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for que in quiz.questions %}
                <tr>
                    <td>{{que.id}}</td>
                    <td>{{que.name}}</td>
<!--                    <td>{{quiz.questions|length}}</td>-->
                    <td>
                        <a href="{{url_for('show_question', question_id=que.id)}}" class="btn btn-primary">
                            <i class="fas fa-search    "></i>
                            Show
                        </a>
                        <a href="{{url_for('edit_question', question_id=que.id)}}" class="btn btn-primary">
                            <i class="fas fa-edit    "></i>
                            Edit
                        </a>
                        <a href="{{url_for('delete_question', question_id=que.id)}}" class="btn btn-danger">
                            <i class="fas fa-trash    "></i>
                            Delete
                        </a>
                    </td>
                </tr>

                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-center">
        <a href="{{url_for('add_question', quiz_id=quiz.id)}}" class="btn btn-success login-btn">
            <i class="fa-solid fa-plus"></i> Add Question
        </a>
    </div>

{% endblock %}
