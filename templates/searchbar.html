<div class="container-fluid mt-3">
    <div class="row">
        <div class="col-md-12">
            <form action="{{url_for('search_quizzes')}}" method="GET">
                <div class="input-group">
                    <input type="text"
                        name="subject_name"
                        id="subject_name"
                        value="{{ request.args.get('subject_name', '') }}"
                        class="form-control"
                        placeholder="Subject Name">

                    <input type="text"
                        name="chapter_name"
                        id="chapter_name"
                        value="{{ request.args.get('chapter_name', '') }}"
                        class="form-control"
                        placeholder="Chapter Name">

                    <input type="text"
                        name="quiz_name"
                        id="quiz_name"
                        value="{{ request.args.get('quiz_name', '') }}"
                        class="form-control"
                        placeholder="Quiz Name">

                    <a href="{{ url_for('index') }}" class="btn btn-outline-danger">
                        <i class="fas fa-backspace"></i> Clear
                    </a>

                    <button class="btn btn-outline-primary" type="submit">
                        <i class="fa fa-search"></i> Search
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
